plugins {
    id 'com.android.application'    version '8.2.0' apply false
    id 'com.android.library'        version '8.2.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}

allprojects {
    // Task to remove invalid 'Icon' files created by macOS
    tasks.register("fixMacOsResources") {
        doLast {
            projectDir.eachFileRecurse { f ->
                // Match "Icon" or names starting with "Icon" followed by special characters (like \r)
                if (f.name.startsWith("Icon")) {
                    println "Deleting invalid resource file: ${f.absolutePath}"
                    f.delete()
                }
            }
        }
    }

    // Ensure the cleanup task runs before every build
    afterEvaluate { project ->
        if (project.tasks.findByName('preBuild')) {
            project.tasks.named('preBuild').configure {
                dependsOn 'fixMacOsResources'
            }
        }
    }
}
